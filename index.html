<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista To Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!--Adicionar icon de menu-->
    <header id="title">
        Weekly Planning
    </header>

    <main>

        <!-- Adicionar elemento para criação das notas -->
        <div id="to-do-container" class="list-container" style="background-color: rgb(157, 101, 230)">
            <p class="list-title">To Do</p>
        </div>
        <div id="doing-container" class="list-container" style="background-color: rgb(224, 166, 79)">
            <p class="list-title">Doing</p>
        </div>
        <div id="done-container" class="list-container" style="background-color: rgb(111, 231, 195)">
            <p class="list-title">Done</p>
        </div>
    </main>

    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
