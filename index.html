<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista To Do</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="resp.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
   
    <header>
        <img src="images/logo-superior.svg" alt="Logo" class="logo">
    
    </header>

    <main>

        <!-- TO DO-->
        <div id="to-do-container" class="list-container" style="background: linear-gradient(to top, rgb(193, 191, 255), rgba(147, 125, 237, 0.3))">
            <p class="list-title">To do</p>
            <button type="button" class="add-container" data-pai="to-do-container">
            <i class="fa-regular fa-plus add-circle-icon"></i>
            <span>Adicionar nota</span>
            </button> 
            <div class="notas-lista"></div>
        <!--Div separada pra n misturar as notas com o botão e título -->
        <!--O JS sabe onde encaixar cada nota nova sem mexer no botão ou título da coluna-->
        

        </div>

        <!-- DOING-->
        <div id="doing-container" class="list-container" style="background: linear-gradient(to top, rgb(224, 166, 79), rgba(224, 166, 79, 0.3))">
            <p class="list-title">Doing</p>
            <button type="button" class="add-container" data-pai="doing-container">
             <i class="fa-regular fa-plus add-circle-icon"></i>
             <span>Adicionar nota</span>
            </button>
             <div class="notas-lista"></div>
        </div>
        
        <!-- DONE -->
        <div id="done-container" class="list-container" style="background: linear-gradient(to top, rgb(111, 231, 195), rgba(111, 231, 195, 0.3))">
            <p class="list-title">Done</p>
                <button type="button" class="add-container" data-pai="done-container">
                 <i class="fa-regular fa-plus add-circle-icon"></i>
                <span>Adicionar nota</span>
                </button>
                <div class="notas-lista"></div>
        </div>

    </main>
    
    <footer>
        <img src="images/logo-inferior.svg" alt="Logo" class="logo-inferior">
    </footer>

    <div id="modal-nota" class="hidden">
        <button id="btn-fechar-modal">&#x2715 Fechar Nota</button>
        <input type="text" id="modal-title" maxlength="30" onblur="alterarTitulo(this)">
        <!--alterarTitulo(this) deve ser refeito para mudar o título do modal-->
        <textarea id="modal-conteudo" class="texto-nota-resumo" placeholder="Escreva sua nota..."></textarea>
        <select name="status" id="modal-status">
            <option value="to-do-container">Não Iniciado</option>
            <option value="doing-container">Fazendo</option>
            <option value="done-container">Pronto</option>
        </select>
        <div id="seletor-cores"></div>
        <button id="btn-salvar-modal">&#10003 Salvar Nota</button>
        <!--Uma alternativa ao botão de salvar é colocar uma função onchange em tudo que pode ser alterado rapidamente(conteudo, por exemplo)-->
    </div>


    <script src="script.js"></script>
</body>
</html>
