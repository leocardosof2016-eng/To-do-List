<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista To Do</title>
    <link rel="stylesheet" href="style.css">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <!--Adicionar icon de menu-->
    <header id="title">
        Weekly Planning
    </header>

    <main>

        <!-- Adicionar elemento para criação das notas -->
        <div id="to-do-container" class="list-container" style="background: linear-gradient(to top, rgb(157, 101, 230), rgba(157, 101, 230, 0.3))">
            <p class="list-title">To Do</p>
            <div class="add-container" data-pai="to-do-container">
                <i class="fa-solid fa-plus add-icon"></i>
                <p class="nota-title">Adicionar Nota</p>
            </div>
        </div>
        <div id="doing-container" class="list-container" style="background: linear-gradient(to top, rgb(224, 166, 79), rgba(224, 166, 79, 0.3))">
            <p class="list-title">Doing</p>
            <div class="add-container" data-pai="doing-container">
                <i class="fa-solid fa-plus add-icon"></i>
                <p class="nota-title">Adicionar Nota</p>
            </div>
        </div>
        <div id="done-container" class="list-container" style="background: linear-gradient(to top, rgb(111, 231, 195), rgba(111, 231, 195, 0.3))">
            <p class="list-title">Done</p>
            <div class="add-container" data-pai="done-container">
                <i class="fa-solid fa-plus add-icon"></i>
                <p class="nota-title">Adicionar Nota</p>
            </div>
        </div>
    </main>

    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
