<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista To Do</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="resp.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="modal.css">
</head>
<body>
   
    <header>
        <img src="images/logo-superior.svg" alt="Logo" class="logo">
    
    </header>

    <main>

        <!-- TO DO-->
        <div id="to-do-container" class="list-container" style="background: linear-gradient(to top, rgb(193, 191, 255), rgba(147, 125, 237, 0.3))">
            <p class="list-title">To do</p>
            <button type="button" class="add-container" data-pai="to-do-container">
            <i class="fa-regular fa-plus add-circle-icon"></i>
            <span>Adicionar nota</span>
            </button> 
            <div class="notas-lista"></div>
        <!--Div separada pra n misturar as notas com o botão e título -->
        <!--O JS sabe onde encaixar cada nota nova sem mexer no botão ou título da coluna-->
        

        </div>

        <!-- DOING-->
        <div id="doing-container" class="list-container" style="background: linear-gradient(to top, rgb(224, 166, 79), rgba(224, 166, 79, 0.3))">
            <p class="list-title">Doing</p>
            <button type="button" class="add-container" data-pai="doing-container">
             <i class="fa-regular fa-plus add-circle-icon"></i>
             <span>Adicionar nota</span>
            </button>
             <div class="notas-lista"></div>
        </div>
        
        <!-- DONE -->
        <div id="done-container" class="list-container" style="background: linear-gradient(to top, rgb(111, 231, 195), rgba(111, 231, 195, 0.3))">
            <p class="list-title">Done</p>
                <button type="button" class="add-container" data-pai="done-container">
                 <i class="fa-regular fa-plus add-circle-icon"></i>
                <span>Adicionar nota</span>
                </button>
                <div class="notas-lista"></div>
        </div>

    </main>
    
    <footer>
        <img src="images/logo-inferior.svg" alt="Logo" class="logo-inferior">
    </footer>

    <div id="modal-overlay">
        <div id="modal-nota">
            <button type="button" id="btn-fechar-modal">✕ Fechar Nota</button> <!--icone-->
            <input type="text" id="modal-title" maxlength="30" value="" onblur="alterarTitulo(this)">
            <textarea id="modal-conteudo" class="texto-nota-resumo" onblur="alterarConteudo(this)" placeholder="Escreva sua nota..."></textarea>
            <div id="modal-rodape"><!--parte onde fica status e salvar-->
                <select name="status" id="modal-status" onchange="alterarStatus(this)">
                    <option value="to-do-container">Não Iniciado</option>
                    <option value="doing-container">Fazendo</option>
                    <option value="done-container">Pronto</option>
                </select>
                <div class="seletor-cores">
                    <i class="fa-solid fa-palette btn-abrir-cores" onclick="toggleMenuCores(event, this)"></i>

                    <div class="menu-cores">
                        <button type="button" class="opcao-cor" data-cor="#ffffff" style="background-color: #ffffff;" title="Padrão" onclick="selecionarCor(event, this)"></button>
                        <button type="button" class="opcao-cor" data-cor="#fff475" style="background-color: #fff475;" title="Amarelo" onclick="selecionarCor(event, this)"></button>
                        <button type="button" class="opcao-cor" data-cor="#cbf0f8" style="background-color: #cbf0f8;" title="Azul" onclick="selecionarCor(event, this)"></button>
                        <button type="button" class="opcao-cor" data-cor="#fdcfe8" style="background-color: #fdcfe8;" title="Rosa" onclick="selecionarCor(event, this)"></button>
                        <button type="button" class="opcao-cor" data-cor="#ccff90" style="background-color: #ccff90;" title="Verde" onclick="selecionarCor(event, this)"></button>
                        <button type="button" class="opcao-cor" data-cor="#e6c9a8" style="background-color: #e6c9a8;" title="Areia" onclick="selecionarCor(event, this)"></button>
                    </div>
                </div>
                <button type="button" id="btn-salvar-modal">✓ Salvar Nota</button>
            </div>
        </div>
    </div>

        <!--Uma alternativa ao botão de salvar é colocar uma função onchange em tudo que pode ser alterado rapidamente(conteudo, por exemplo)-->
    
    


    <script src="script.js"></script>
</body>
</html>
